name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK and NDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Compact and verify test APK
        run: |
          python3 scripts/compact-debug-apk.py
          ./scripts/verify-apk.sh dist/AILinux-Pocket-AI-0.1.0-alpha-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AILinux-Pocket-AI-debug-arm64
          path: dist/AILinux-Pocket-AI-0.1.0-alpha-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
