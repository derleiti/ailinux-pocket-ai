name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and NDK
        run: |
          test -d "$ANDROID_HOME" || { echo "Android SDK missing on runner"; exit 1; }
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Create temporary CI-only debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" \
              -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android
          fi
      - name: Compact and verify test APK
        run: |
          python3 scripts/compact-debug-apk.py
          ./scripts/verify-apk.sh dist/AILinux-Pocket-AI-1.0.0-rc.6-arm64-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AILinux-Pocket-AI-debug-arm64
          path: dist/AILinux-Pocket-AI-1.0.0-rc.6-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
