name: Android CI
on:
  push:
    branches: [main]
    tags: ['v2.1.0-RC*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Cancel superseded PR builds rather than burning minutes on old commits.
concurrency:
  group: pocket-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Reject unresolved merge artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_merge_artifacts.py
          python3 -m unittest discover -s scripts/tests -p 'test_merge_artifact_guard.py' -v
      - name: Release PR must target main
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/pocket-')
        env:
          PR_BASE: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PR_BASE" != "main" ]; then
            echo "::error::Release branch must target main, not $PR_BASE. PR #57 did not update main."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install missing Android SDK and NDK components
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME" || { echo "Android SDK missing on runner"; exit 1; }
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          packages=()
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then packages+=("platforms;android-36"); fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then packages+=("build-tools;35.0.0"); fi
          if [ ! -d "$ANDROID_HOME/ndk/29.0.13113456" ]; then packages+=("ndk;29.0.13113456"); fi
          if [ ! -d "$ANDROID_HOME/cmake/3.31.6" ]; then packages+=("cmake;3.31.6"); fi
          if [ "${#packages[@]}" -gt 0 ]; then
            echo "Installing: ${packages[*]}"
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "${packages[@]}" < <(yes)
          else
            echo "All required Android components already installed."
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Check immutable release candidate tag against Gradle
        if: startsWith(github.ref, 'refs/tags/v2.1.0-RC')
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          actual_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)"
          expected_version="${GITHUB_REF_NAME#v}"
          # The original RC19 tag is immutable but points to RC18 source.
          # Allow ONLY this explicitly audited forward-only RC19 repair tag.
          if [ "$GITHUB_REF_NAME" = "v2.1.0-RC19-recovery1" ]; then
            expected_version="2.1.0-RC19"
            test "$actual_code" = "44" || {
              echo "RC19 recovery must use versionCode 44" >&2
              exit 1
            }
          fi
          test "$expected_version" = "$actual_version" || {
            echo "Tag $GITHUB_REF_NAME does not match Gradle $actual_version" >&2
            exit 1
          }
          test "$actual_code" -gt 33 || {
            echo "Expected a versionCode newer than RC8" >&2
            exit 1
          }
          echo "Verified RC tag: $expected_version (versionCode=$actual_code)"
      - name: Create temporary CI-only debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" \
              -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android
          fi
      - name: Build and tests
        run: ./gradlew --no-daemon --build-cache :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Read versioned APK path from Gradle
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(rc\.[0-9]+|RC[0-9]+)$ ]]; then
            echo "Unexpected RC versionName: $version" >&2
            exit 1
          fi
          echo "apk_path=dist/AILinux-Pocket-AI-${version}-arm64-debug.apk" >> "$GITHUB_OUTPUT"
      - name: Compact and verify test APK
        run: |
          python3 scripts/compact-debug-apk.py
          ./scripts/verify-apk.sh ${{ steps.version.outputs.apk_path }}
      - uses: actions/upload-artifact@v4
        with:
          name: AILinux-Pocket-AI-debug-arm64
          path: ${{ steps.version.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
