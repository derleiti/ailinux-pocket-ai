name: Android Fast Checks

# PRs get fast Kotlin/JVM feedback without building native C++ or an APK.
# On the default branch, manual runs can additionally build a debug test APK.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      apk:
        description: "Also build, sign and upload an ARM64 test APK (slower)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: pocket-fast-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fast unit tests${{ github.event_name == 'workflow_dispatch' && inputs.apk && ' + APK' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_APK: ${{ github.event_name == 'workflow_dispatch' && inputs.apk }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Gradle task outputs and dependency cache; no extra huge SDK cache.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install required Android components only if missing
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME" || { echo "Android SDK missing"; exit 1; }
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          packages=()
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            packages+=("platforms;android-36")
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            packages+=("build-tools;35.0.0")
          fi
          if [ "$BUILD_APK" = "true" ]; then
            if [ ! -d "$ANDROID_HOME/ndk/29.0.13113456" ]; then
              packages+=("ndk;29.0.13113456")
            fi
            if [ ! -d "$ANDROID_HOME/cmake/3.31.6" ]; then
              packages+=("cmake;3.31.6")
            fi
          fi
          if [ "${#packages[@]}" -gt 0 ]; then
            echo "Installing missing Android SDK components: ${packages[*]}"
            # Process substitution avoids yes(1) SIGPIPE failing pipefail.
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "${packages[@]}" < <(yes)
          else
            echo "Required SDK components are already installed."
          fi

      - name: Read app version from Gradle
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "Unexpected RC versionName: $version" >&2
            exit 1
          fi
          echo "apk_path=dist/AILinux-Pocket-AI-${version}-arm64-debug.apk" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Android JVM unit tests (fast)
        run: ./gradlew --no-daemon --build-cache :app:testDebugUnitTest

      - name: Create CI-only test signing key
        if: env.BUILD_APK == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US" \
              -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android
          fi

      - name: Build ARM64 debug APK
        if: env.BUILD_APK == 'true'
        run: ./gradlew --no-daemon --build-cache :app:assembleDebug

      - name: Compact, sign and verify APK
        if: env.BUILD_APK == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compact-debug-apk.py
          ./scripts/verify-apk.sh "${{ steps.version.outputs.apk_path }}"

      - uses: actions/upload-artifact@v4
        if: env.BUILD_APK == 'true'
        with:
          name: AILinux-Pocket-AI-fast-arm64
          path: ${{ steps.version.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Pocket AI ${{ steps.version.outputs.version }} – fast checks"
            echo ""
            if [ "$BUILD_APK" = "true" ]; then
              echo "Requested APK: \` ${{ steps.version.outputs.apk_path }} \`"
              echo "CI debug APKs use an ephemeral key and may NOT install over existing releases."
            else
              echo "Fast JVM/Android unit tests only; no APK was built."
              echo "Use **Run workflow → apk=true** for a test APK on the default branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
